- name: QFEX Market Data WebSocket (MDS)
  description: >-
    Multiplexed WebSocket gateway for all QFEX real-time market data streams: order book, trades, candles,
    BBO, mark price, funding rate, open interest, market stats and reference data. Documented as AsyncAPI
    3.0.
  humanURL: https://docs.qfex.com/websocket/mds
  baseURL: wss://mds.qfex.com
  tags:
