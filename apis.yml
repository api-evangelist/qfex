  properties:
  - type: AsyncAPI
    url: asyncapi/qfex-mds-asyncapi.yml
- name: QFEX Trade WebSocket
  description: >-
    Multiplexed WebSocket gateway for QFEX order entry and account streams: add / modify / cancel orders,
    stop orders, TWAPs, close position, leverage, balances, positions, fills and order responses. Requires
    HMAC-SHA256 authentication within one minute of connecting. Documented as AsyncAPI 3.0.
  humanURL: https://docs.qfex.com/websocket/trade
  baseURL: wss://trade.qfex.com
