aid: qfex
name: Qfex
description: >-
  QFEX is the first 24/7 exchange built exclusively for US equities, commodities,
  and FX, offering high-leverage perpetual futures on traditional assets without a
  broker. Founded by former Tower Research and Citadel engineers who met studying
  mathematics at Cambridge, QFEX gives retail and institutional traders direct,
  high-frequency access to markets around the clock. Its developer platform exposes
  a REST API for historic market data and account operations, two multiplexed
  WebSocket gateways (market data and trading) documented with AsyncAPI 3.0, and a
  JSON-native CLI purpose-built for agentic trading workflows. Authentication uses
  HMAC-SHA256 request signing with public/secret API key pairs.
